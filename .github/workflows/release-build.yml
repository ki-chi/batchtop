name: Release builds

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
            cc: /usr/bin/cc
            cxx: /usr/bin/c++
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            cc: /usr/bin/cc
            cxx: /usr/bin/c++
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: darwin-arm64
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++

    env:
      CARGO_TERM_COLOR: always
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      RUST_VERSION: 1.94.0
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke test binary
        run: "target/$TARGET/release/batchtop --version"

      - name: Package binary
        run: |
          set -euo pipefail
          archive="batchtop-${GITHUB_REF_NAME}-${ASSET}.tar.gz"
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/$archive" batchtop
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: batchtop-${{ github.ref_name }}-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: batchtop-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 3
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l | tr -d ' ')" -eq 3
          cd dist
          sha256sum --check --strict *.sha256

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.tar.gz dist/*.sha256 \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
