[package]
name = "batchtop"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "A read-only, keyboard-first terminal UI for AWS Batch"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1.92"
aws-config = "=1.8.18"
aws-sdk-batch = "=1.118.0"
aws-sdk-cloudwatchlogs = "=1.140.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
futures = "0.3.31"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
